<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aura Mood — подарочный код</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg:#f6faf8; --card:#fff; --text:#0f1f18; --dim:#4b5d55; --accent:#0e9f6e; --ink:#03130c; --border:#dbe7e1; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#030806; --card:#07140e; --text:#eafaf2; --dim:#9bb8aa; --accent:#34d399; --ink:#03130c; --border:#173226; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text);
      font:17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust:100%; }
    main { width:100%; max-width:440px; text-align:center; }
    .logo { font-size:56px; line-height:1; }
    h1 { font-size:26px; line-height:1.2; margin:16px 0 8px; }
    p { color:var(--dim); margin:0 0 20px; }
    .code { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin:0 0 16px;
      font:600 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--text); word-break:break-all; text-align:left; user-select:all; -webkit-user-select:all; }
    .btn { display:block; width:100%; border:0; border-radius:999px; padding:16px 24px; margin:0 0 12px; font-weight:700; font-size:17px; line-height:1; font-family:inherit; cursor:pointer;
      text-decoration:none; background:var(--accent); color:var(--ink); transition:transform .4s cubic-bezier(.32,.72,0,1); }
    .btn:active { transform:scale(.98); }
    .btn.ghost { background:transparent; color:var(--accent); }
    .hint { font-size:14px; margin-top:20px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">🎁</div>
  <h1 id="title"></h1>
  <p id="lead"></p>
  <div id="codeBox" class="code" hidden></div>
  <a id="open" class="btn" href="#" hidden></a>
  <button id="copy" class="btn ghost" type="button" hidden></button>
  <p id="hint" class="hint"></p>
  <p id="empty" hidden></p>
</main>
<script>
  var T = {
    ru: { title: 'Подарок от Aura Mood', lead: 'Нажми кнопку: приложение откроется и само активирует код.', open: 'Открыть в Aura Mood', copy: 'Скопировать код', copied: 'Скопировано',
      hint: 'Если кнопка ничего не делает, скопируй код и вставь его в приложении: Настройки → Premium → «Ввести промокод». Ссылку лучше открывать в Safari или Chrome.',
      empty: 'В ссылке нет кода. Попроси новую ссылку у того, кто тебе её дал.' },
    en: { title: 'A gift from Aura Mood', lead: 'Tap the button: the app opens and activates the code by itself.', open: 'Open in Aura Mood', copy: 'Copy code', copied: 'Copied',
      hint: 'If the button does nothing, copy the code and paste it in the app: Settings → Premium → “Enter promo code”. Open this link in Safari or Chrome.',
      empty: 'There is no code in this link. Ask for a new one.' },
    uk: { title: 'Подарунок від Aura Mood', lead: 'Натисни кнопку: застосунок відкриється й сам активує код.', open: 'Відкрити в Aura Mood', copy: 'Скопіювати код', copied: 'Скопійовано',
      hint: 'Якщо кнопка нічого не робить, скопіюй код і встав його в застосунку: Налаштування → Premium → «Ввести промокод». Посилання краще відкривати в Safari або Chrome.',
      empty: 'У посиланні немає коду. Попроси нове.' }
  };
  var lang = (navigator.language || 'ru').slice(0, 2);
  var t = T[lang] || (lang === 'ru' || lang === 'be' ? T.ru : T.en);
  document.documentElement.lang = T[lang] ? lang : 'en';
  document.getElementById('title').textContent = t.title;
  // код - только латиница, цифры и дефисы; всё остальное отбрасываем
  var code = decodeURIComponent((location.hash || '').slice(1)).replace(/[^0-9A-Za-z-]/g, '');
  if (code.length < 20) {
    document.getElementById('empty').textContent = t.empty;
    document.getElementById('empty').hidden = false;
    document.getElementById('hint').hidden = true;
  } else {
    document.getElementById('lead').textContent = t.lead;
    var box = document.getElementById('codeBox'); box.textContent = code; box.hidden = false;
    var open = document.getElementById('open'); open.textContent = t.open;
    open.href = 'rudichdiaryrn:///promo?code=' + encodeURIComponent(code); open.hidden = false;
    var copy = document.getElementById('copy'); copy.textContent = t.copy; copy.hidden = false;
    copy.onclick = function () {
      var done = function () { copy.textContent = t.copied; setTimeout(function () { copy.textContent = t.copy; }, 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, function () {});
      else { var r = document.createRange(); r.selectNodeContents(box); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    };
    document.getElementById('hint').textContent = t.hint;
  }
</script>
</body>
</html>
